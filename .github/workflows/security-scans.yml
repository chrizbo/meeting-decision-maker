name: Security scans

on:
  workflow_dispatch:
    inputs:
      dast_target:
        description: Public HTTPS URL for OWASP ZAP baseline scan
        required: true
        default: https://roomclarity.com
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '24 10 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results.sarif

      - name: Upload CodeQL artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sast-results
          path: codeql-results.sarif
          if-no-files-found: ignore
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --omit=dev --json > npm-audit-results.json

      - name: Upload npm audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: npm-audit-results.json

  zap-baseline:
    name: OWASP ZAP DAST baseline
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ github.event.inputs.dast_target }}
          fail_action: false
          artifact_name: zap-baseline-results
